# Test profile: boots the real Spring context against an in-memory H2 database in
# MySQL compatibility mode, so CI can verify the application actually starts without
# needing a live MySQL or Redis.
# NON_KEYWORDS=VALUE: `value` is a reserved word in H2 but not in MySQL, so
# OtWorkflowPolicy.value made CREATE TABLE ot_workflow_policies fail and the table was
# silently absent from the test schema while existing fine in production.
spring.datasource.url=jdbc:h2:mem:hms;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# DatabaseMigrationRunner issues MySQL-specific DDL. It is idempotent and already
# guards every statement in try/catch, but there is nothing for it to migrate against
# a schema Hibernate just created from the entities, so skip it here.
hms.migrations.enabled=false

jwt.secret=test-secret-key-that-is-long-enough-for-hs512-signing-in-unit-tests-000000
jwt.expiration=3600000

frontend.url=http://localhost:5173

# Rate limiting off for the integration suite.
#
# The limiter's buckets are per-JVM and keyed by client address, and every @SpringBootTest in the
# run drives the same in-process server from 127.0.0.1. Once the two demo waves merged, the
# suite's HTTP volume crossed the AUTHENTICATED tier's 300-per-minute allowance and unrelated
# tests began failing with 429 -- PatientApiTest first, because of where it fell in the order.
# That is one test's traffic deciding another's result, which makes the suite a poor witness.
#
# No coverage is lost: RateLimitFilterTest exercises the filter directly with the shipped
# thresholds set explicitly, which is a better test of the limiter than incidental pressure from
# unrelated suites.
ratelimit.enabled=false
