# Database Configuration
spring.application.name=Hospital Management System
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hospital_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Development default: `update` keeps local dev friction-free (Hibernate evolves the dev schema).
# Staging & Production OVERRIDE this to a safe value in their profiles (see application-staging /
# application-prod). Override anywhere via HIBERNATE_DDL_AUTO. See docs/database/DATABASE_MIGRATIONS.md.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway — OFF by default (dev/test use ddl-auto). Enabled only in staging/prod profiles.
# `clean-disabled=true` GLOBALLY so `flyway:clean` (which DROPS the whole schema) can never run —
# a hard guard against catastrophic data loss on a healthcare database.
spring.flyway.enabled=false
spring.flyway.clean-disabled=true

# Connection Pool (HikariCP) Tuning
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.keepalive-time=45000

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:YOUR_SECRET_KEY_HERE_MUST_BE_VERY_LONG_FOR_SECURITY}
# Token lifetime in ms. Default 12h — long enough to cover a full hospital shift
# without a re-login, short enough that a leaked token is not valid indefinitely.
# There is no refresh or revocation mechanism, so this value is the only bound on
# a stolen token's lifetime. Override with JWT_EXPIRATION if a site needs different.
jwt.expiration=${JWT_EXPIRATION:43200000}

# CORS Configuration
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}

# File upload limits (CSV imports). CsvUploads also enforces a 5 MB cap + .csv extension in code.
# Private directory for patient clinical documents. Must be persistent storage OUTSIDE anything
# the web server publishes -- there is no URL for these files; the application streams them after
# checking who is asking. Production refuses to start without it rather than writing clinical
# records somewhere ephemeral.
hms.document-storage.root=${HMS_DOCUMENT_STORAGE_PATH:}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:6MB}

# Rate limiting (RateLimitFilter). All thresholds are capacity (tokens) per refill window (minutes).
# Tiers: AUTH (login) is strictest and enforced per-IP AND per-account; PUBLIC is moderate;
# AUTHENTICATED (everything else) is loosest. Set ratelimit.enabled=false to disable.
ratelimit.enabled=${RATELIMIT_ENABLED:true}
ratelimit.auth.ip.capacity=${RATELIMIT_AUTH_IP_CAPACITY:10}
ratelimit.auth.ip.refill-minutes=${RATELIMIT_AUTH_IP_REFILL_MINUTES:1}
ratelimit.auth.account.capacity=${RATELIMIT_AUTH_ACCOUNT_CAPACITY:5}
ratelimit.auth.account.refill-minutes=${RATELIMIT_AUTH_ACCOUNT_REFILL_MINUTES:15}
ratelimit.public.capacity=${RATELIMIT_PUBLIC_CAPACITY:60}
ratelimit.public.refill-minutes=${RATELIMIT_PUBLIC_REFILL_MINUTES:1}
ratelimit.authenticated.capacity=${RATELIMIT_AUTHENTICATED_CAPACITY:300}
ratelimit.authenticated.refill-minutes=${RATELIMIT_AUTHENTICATED_REFILL_MINUTES:1}

# Logging
logging.level.com.hms=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

# Redis Configuration (Docker local/prod settings)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
# Enable Caching
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Actuator
# health + info are public (see SecurityConfig). prometheus + metrics are exposed but remain
# AUTHENTICATED (not in the permitAll list) — restrict scraping to the internal Prometheus via
# Nginx/localhost or a management port. See docs/monitoring/OBSERVABILITY.md.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true
# Readiness/liveness probe groups (useful for orchestration later; harmless now).
management.endpoint.health.probes.enabled=true
# HTTP latency histograms + SLO buckets so Prometheus/Grafana can compute p95/p99 and error rate.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,400ms,800ms,2s
management.prometheus.metrics.export.enabled=true
# Build/version metadata on /actuator/info (populated from build-info.properties + git.properties
# embedded at build time). Lets ops identify exactly which build runs at each hospital site.
management.info.build.enabled=true
management.info.git.mode=full
management.info.env.enabled=false

