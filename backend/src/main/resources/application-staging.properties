# Staging profile — used when SPRING_PROFILES_ACTIVE=staging
# In-memory cache; avoids any Redis dependency issues on staging
spring.cache.type=simple

# ── Schema management (staging) ──────────────────────────────────────────────
# Staging uses `update`: Hibernate reconciles the schema to the entities at startup.
# This app manages most of its schema through DatabaseMigrationRunner (an idempotent,
# ApplicationReadyEvent-based runner that owns ~40 tables + ~50 columns — the Nurse/OT
# modules, pharmacy branches, presets, etc.). Under `validate`, a single missing object
# aborts startup BEFORE the ready event fires, so the runner can never create it — a
# deadlock that took staging down when the Nurse module entities were added without a
# matching Flyway migration. `update` lets Hibernate create/extend those tables to match
# the entities before startup; the runner then handles data backfills. `update` only adds
# tables/columns (never drops), so it is non-destructive. Override with HIBERNATE_DDL_AUTO
# to force a specific mode. See docs/database/DATABASE_MIGRATIONS.md.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# Keep the session open during request serialization as a safety net
# for any lazy-loaded associations not covered by JOIN FETCH queries
spring.jpa.open-in-view=true

# Verbose logging to diagnose issues
logging.level.com.hms=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
