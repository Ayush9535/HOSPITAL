# Production profile — tighter logging, no SQL output
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Schema management (prod) ─────────────────────────────────────────────────
# Prod uses `update`, matching staging and how this app actually builds its schema.
#
# WHY (not `validate`): most of the schema (~40 tables + ~50 columns — the Nurse/OT modules,
# pharmacy branches, presets, etc.) is created by DatabaseMigrationRunner, which runs on
# ApplicationReadyEvent — i.e. AFTER a successful startup. Under `validate`, the first entity
# whose table the runner hasn't created yet aborts startup BEFORE the ready event fires, so the
# runner can never create it. That deadlock 502'd the whole site when the Nurse module was added
# without a matching Flyway migration. The pre-Flyway V6-V11 migrations also contain non-MySQL
# syntax and were never executed, so Flyway is not a viable single source of truth here.
#
# `update` reconciles the schema to the entities before startup, making that failure mode
# structurally impossible. It is ADDITIVE ONLY — it creates missing tables/columns and never
# drops or narrows anything, so it cannot lose data. It does NOT handle renames, drops, or data
# migrations: do those as an explicit, reviewed step (with the pre-deploy backup the pipeline
# already takes). Override with HIBERNATE_DDL_AUTO to force a specific mode.
# See docs/database/DATABASE_MIGRATIONS.md.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=11
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
logging.level.root=WARN
logging.level.com.hms=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.com.zaxxer.hikari=WARN
