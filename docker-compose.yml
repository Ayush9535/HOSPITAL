version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hms-mysql
    restart: always
    environment:
      MYSQL_DATABASE: hms
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: hms-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: hms-frontend
    restart: always
    ports:
      # Container serves on 8080 (non-root nginx-unprivileged); still published on host :80.
      - "80:8080"
    depends_on:
      - backend

volumes:
  db-data:
