name: Setup Node.js
description: Install Node.js and run npm ci in a given working directory

inputs:
  node-version:
    description: Node.js version to use
    default: '22'
  working-directory:
    description: Directory containing package-lock.json
    default: frontend

runs:
  using: composite
  steps:
    # Pin to SHA in production: https://github.com/actions/setup-node/releases
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.11.1

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # npm ci = strict, reproducible install from the lockfile. It FAILS if package.json and
      # package-lock.json drift, which is the guardrail that stops accidental dependency changes
      # from reaching staging/production. Keep this as `npm ci` (never `npm install`) in CI; if it
      # fails on drift, fix by committing a synced lockfile, not by loosening the command.
      run: npm ci
