# ────────────────────────────────────────────
# Validation — Hospital Management System
# ────────────────────────────────────────────

name: Validation

on:
  push:
    branches-ignore:
      - main
      - staging
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
    with:
      node-version: ${{ vars.NODE_VERSION || '22' }}
