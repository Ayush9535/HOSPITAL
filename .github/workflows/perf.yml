name: Performance (k6)

# Performance smoke — the SLOW tier, dispatch-only. Runs the k6 baseline against a target URL
# you provide. Never runs on push/PR (a load test against a shared env should be deliberate).
# See docs/testing/TESTING_STRATEGY.md §Performance.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (e.g. https://staging.example.com)'
        required: true
        type: string
      vus:
        description: 'Virtual users'
        required: false
        default: '5'
        type: string
      duration:
        description: 'Test duration (e.g. 30s, 2m)'
        required: false
        default: '30s'
        type: string

permissions:
  contents: read

jobs:
  k6:
    name: k6 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin to SHA in production: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke
        env:
          PERF_BASE_URL: ${{ inputs.base_url }}
          PERF_VUS: ${{ inputs.vus }}
          PERF_DURATION: ${{ inputs.duration }}
        run: k6 run --summary-export perf/summary.json perf/smoke.js

      - name: Upload k6 summary
        if: always()
        # Pin to SHA in production: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ github.sha }}
          path: perf/summary.json
          retention-days: 14
          if-no-files-found: warn
