name: Supply Chain Security

# Software supply-chain controls: SBOM generation, Trivy filesystem/Dockerfile scanning, and
# license compliance. Deliberately NON-BLOCKING ("observe mode") for now — these jobs upload
# SARIF to the Security tab and write step summaries, but do not fail the run, so they never
# affect the required `security` gate or deployment. Promotion to blocking is documented in
# docs/security/SUPPLY_CHAIN.md.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      java-version:
        type: string
        default: '17'

permissions:
  contents: read

jobs:
  # ── 1. SBOM (CycloneDX) — frontend (npm) + backend (Maven) ─────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # for optional cosign keyless signing (gated off by default)
    steps:
      # Pin to SHA in production: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: frontend

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: ${{ inputs.java-version }}

      - name: Generate frontend SBOM (CycloneDX)
        working-directory: frontend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@1.19.3 \
            --output-format JSON \
            --output-file ../sbom-frontend.json || echo "frontend SBOM generation failed (non-blocking)"

      - name: Generate backend SBOM (CycloneDX)
        run: |
          mvn -q -B -f backend/pom.xml \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            --no-transfer-progress || echo "backend SBOM generation failed (non-blocking)"
          cp backend/target/bom.json sbom-backend.json 2>/dev/null || true
          cp backend/target/bom.xml sbom-backend.xml 2>/dev/null || true

      - name: SBOM summary
        if: always()
        run: |
          {
            echo "## SBOM (CycloneDX)"
            echo ""
            echo "| Component | Format | Generated |"
            echo "| --- | --- | --- |"
            [ -f sbom-frontend.json ] && echo "| Frontend (npm) | CycloneDX JSON | ✅ |" || echo "| Frontend (npm) | CycloneDX JSON | ❌ |"
            [ -f sbom-backend.json ] && echo "| Backend (Maven) | CycloneDX JSON+XML | ✅ |" || echo "| Backend (Maven) | CycloneDX JSON+XML | ❌ |"
            echo ""
            if command -v jq >/dev/null 2>&1 && [ -f sbom-backend.json ]; then
              echo "Backend components: \`$(jq '.components | length' sbom-backend.json 2>/dev/null || echo '?')\`"
            fi
            echo ""
            echo "SBOMs are uploaded as build artifacts (\`sbom-${{ github.sha }}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- OPTIONAL: keyless artifact signing (prepared, OFF by default) --------
      # Enable by setting repo variable ENABLE_COSIGN=true. Signs the SBOMs as blobs using
      # Sigstore keyless (OIDC) — no long-lived keys. Full activation (incl. image signing)
      # lands with the deployment/release phase. See docs/security/SUPPLY_CHAIN.md §Signing.
      - name: Install Cosign
        if: vars.ENABLE_COSIGN == 'true'
        # Pin to SHA in production: https://github.com/sigstore/cosign-installer/releases
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOMs (keyless)
        if: vars.ENABLE_COSIGN == 'true'
        env:
          COSIGN_YES: 'true'
        run: |
          for f in sbom-frontend.json sbom-backend.json; do
            if [ -f "$f" ]; then
              cosign sign-blob --output-signature "$f.sig" --output-certificate "$f.pem" "$f" || true
            fi
          done

      - name: Upload SBOM artifacts
        if: always()
        # Pin to SHA in production: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-frontend.json
            sbom-backend.json
            sbom-backend.xml
            sbom-frontend.json.sig
            sbom-frontend.json.pem
            sbom-backend.json.sig
            sbom-backend.json.pem
          retention-days: 90
          if-no-files-found: warn

  # ── 2. Trivy filesystem + Dockerfile scan ─────────────────────────────────
  trivy-fs:
    name: Trivy (filesystem + Dockerfile)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      # Pin to SHA in production: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v4

      # Run Trivy from its official pinned Docker image. The install.sh path fetches the binary
      # through a redirect service (get.trivy.dev) that has been unreliable on the runner; the
      # Docker image is pulled straight from Docker Hub (preinstalled on the runner) and pinned by
      # tag, which is stable. See https://github.com/aquasecurity/trivy/pkgs.
      - name: Pull Trivy image
        run: docker pull aquasec/trivy:0.58.1

      - name: Trivy filesystem scan (vuln + secret + misconfig) → SARIF
        run: |
          # Observe mode: --exit-code 0 so findings surface in the Security tab without blocking.
          docker run --rm -e TRIVY_DISABLE_VEX_NOTICE=true -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.58.1 fs --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format sarif --output trivy-fs.sarif --exit-code 0 . \
            || echo "trivy SARIF scan hit an issue (non-blocking)"

      - name: Trivy human-readable table → step summary
        run: |
          docker run --rm -e TRIVY_DISABLE_VEX_NOTICE=true -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.58.1 fs --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --format table --output trivy-fs.txt --exit-code 0 . \
            || echo "trivy table scan hit an issue (non-blocking)"

      - name: Write Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy — Filesystem & Dockerfile"
            echo ""
            echo "Scanners: vulnerabilities, secrets, misconfigurations. Severity: CRITICAL, HIGH (unfixed ignored)."
            echo ""
            if [ -s trivy-fs.txt ]; then
              echo '```'
              head -c 60000 trivy-fs.txt
              echo '```'
            else
              echo "No CRITICAL/HIGH findings. ✅"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        continue-on-error: true
        # Pin to SHA in production: https://github.com/github/codeql-action/releases
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy report artifact
        if: always()
        # Pin to SHA in production: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report-${{ github.sha }}
          path: |
            trivy-fs.sarif
            trivy-fs.txt
          retention-days: 30
          if-no-files-found: warn

  # ── 3. License compliance — frontend (npm) + backend (Maven) ───────────────
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      # Pin to SHA in production: https://github.com/actions/checkout/releases
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: frontend

      - name: Setup Java
        uses: ./.github/actions/setup-java
        with:
          java-version: ${{ inputs.java-version }}

      - name: Frontend license inventory
        working-directory: frontend
        run: |
          npx --yes license-checker-rseidelsohn@4.4.2 \
            --json --out ../licenses-frontend.json 2>/dev/null || echo "{}" > ../licenses-frontend.json
          npx --yes license-checker-rseidelsohn@4.4.2 \
            --summary --out ../licenses-frontend-summary.txt 2>/dev/null || true

      - name: Backend license inventory
        run: |
          mvn -q -B -f backend/pom.xml \
            org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-add-third-party \
            -Dlicense.outputDirectory=target/generated-licenses \
            -Dlicense.thirdPartyFilename=THIRD-PARTY.txt \
            --no-transfer-progress || echo "backend license scan failed (non-blocking)"
          cp backend/target/generated-licenses/THIRD-PARTY.txt licenses-backend.txt 2>/dev/null || true

      - name: License policy check (report restricted/copyleft)
        if: always()
        run: |
          # Copyleft / restricted licenses we must review before shipping (see policy doc).
          RESTRICTED='GPL-2.0|GPL-3.0|AGPL|LGPL|SSPL|CC-BY-NC|BUSL|EUPL'
          {
            echo "## License Compliance"
            echo ""
            echo "Policy: docs/security/DEPENDENCY_POLICY.md §Licenses. Flagged = needs review, not an automatic block."
            echo ""
            echo "### Frontend (npm)"
            if [ -f licenses-frontend-summary.txt ]; then
              echo '```'; cat licenses-frontend-summary.txt; echo '```'
            fi
            FE_HITS=$(grep -Eio "$RESTRICTED" licenses-frontend.json 2>/dev/null | sort -u | tr '\n' ' ' || true)
            echo ""
            echo "Restricted licenses in frontend: ${FE_HITS:-none ✅}"
            echo ""
            echo "### Backend (Maven)"
            BE_HITS=$(grep -Eio "$RESTRICTED" licenses-backend.txt 2>/dev/null | sort -u | tr '\n' ' ' || true)
            echo "Restricted licenses in backend: ${BE_HITS:-none ✅}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license reports
        if: always()
        # Pin to SHA in production: https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: license-reports-${{ github.sha }}
          path: |
            licenses-frontend.json
            licenses-frontend-summary.txt
            licenses-backend.txt
          retention-days: 90
          if-no-files-found: warn

  # ── 4. Supply-chain dashboard summary ──────────────────────────────────────
  supply-chain-summary:
    name: Supply Chain Summary
    runs-on: ubuntu-latest
    needs: [sbom, trivy-fs, license-compliance]
    if: always()
    steps:
      - name: Write dashboard
        run: |
          {
            echo "## 🔗 Supply Chain Security Summary"
            echo ""
            echo "| Control | Result | Mode |"
            echo "| --- | --- | --- |"
            echo "| SBOM (CycloneDX) | ${{ needs.sbom.result }} | artifact |"
            echo "| Trivy (fs + Dockerfile) | ${{ needs.trivy-fs.result }} | observe (SARIF → Security tab) |"
            echo "| License compliance | ${{ needs.license-compliance.result }} | observe |"
            echo ""
            echo "All supply-chain jobs run in **observe mode** (non-blocking). See"
            echo "\`docs/security/SUPPLY_CHAIN.md\` for artifacts, retention, and how to promote to blocking."
          } >> "$GITHUB_STEP_SUMMARY"
